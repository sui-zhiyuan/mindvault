[package]
name = "xorchain"
version = "0.1.0"
edition = "2021"
description = "Streaming reversible prefix-XOR file encoder/decoder"
license = "MIT"

[[bin]]
name = "xorchain"
path = "src/main.rs"

[lib]
name = "xorchain"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
