[package]
name = "xorchain"
version = "0.1.0"
edition = "2021"
description = "Streaming reversible prefix-XOR file encoder/decoder"
license = "MIT"

[[bin]]
name = "xorchain"
path = "src/main.rs"

[lib]
name = "xorchain"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# 0.3 uses raw-dylib on Windows, which requires dlltool.exe on -gnu
# toolchains. 0.2 uses normal Windows import libraries instead.
getrandom = "0.2"
